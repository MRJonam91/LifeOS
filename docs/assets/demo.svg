    </linearGradient>
    <style>
      .term-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; font-weight: 600; }
      .term-text { font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #f8fafc; }
      .prompt { fill: #38bdf8; font-weight: bold; }
      .cmd { fill: #facc15; }
      .accent { fill: #34d399; }
      .warn { fill: #fbbf24; }
      .err { fill: #f87171; }
      .dim { fill: #64748b; }
      .cyan { fill: #22d3ee; }
